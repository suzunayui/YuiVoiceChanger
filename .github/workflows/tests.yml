name: Tests
on: [push, pull_request]
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install numpy
      - run: python tests/run.py
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: node tests/settings-transfer.cjs
      - run: npm run dist
