name: Apple Silicon build
on:
  workflow_dispatch:
  push:
    branches: [feature/macos-arm64]
concurrency:
  group: mac-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci --no-audit
      - name: Exercise native automatic setup
        run: node scripts/check-mac-runtime.cjs "$RUNNER_TEMP/yvc-mac-runtime"
      - name: Test Python processing without microphone access
        run: |
          "$MAC_RUNTIME_PYTHON" tests/run.py
          "$MAC_RUNTIME_PYTHON" scripts/check-mac-inference.py
      - run: npm run test:config
      - name: Build DMG
        run: npm run dist:mac -- --config.directories.output=release/mac-build
      - name: Check app bundle and desktop UI
        run: |
          APP=release/mac-build/mac-arm64/YuiVoiceChanger.app
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          node tests/mac-smoke.cjs "$APP/Contents/MacOS/YuiVoiceChanger"
      - name: Checksums
        run: |
          cd release/mac-build
          shasum -a 256 *.dmg > SHA256SUMS-mac-arm64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: YuiVoiceChanger-mac-arm64
          path: |
            release/mac-build/*.dmg
            release/mac-build/SHA256SUMS-mac-arm64.txt
          if-no-files-found: error
