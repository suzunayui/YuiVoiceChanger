[package]
name = "yvc-core"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "fake-worker"
path = "src/bin/fake-worker.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex-lite = "0.1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
